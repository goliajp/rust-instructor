name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: cargo test --workspace --no-default-features --lib
      - run: cargo test --workspace --all-features

  core:
    name: core builds (no default features, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features derive,cost-tracking --target wasm32-unknown-unknown
      - name: the derive adds no crate and no syn feature to a serde user's build
        run: |
          mkdir -p "$RUNNER_TEMP/user/src"
          cd "$RUNNER_TEMP/user"
          printf '[package]\nname = "user"\nversion = "0.0.0"\nedition = "2024"\n[workspace]\n[dependencies]\ninstructors = { path = "%s", default-features = false, features = ["derive"] }\nserde = { version = "1", features = ["derive"] }\n' "$GITHUB_WORKSPACE" > Cargo.toml
          echo 'fn main() {}' > src/main.rs
          features=$(cargo tree -e features -i syn --depth 1 | grep -o 'syn feature "[a-z-]*"' | sort -u | tr '\n' ' ')
          echo "$features"
          test "$features" = 'syn feature "clone-impls" syn feature "default" syn feature "derive" syn feature "parsing" syn feature "printing" syn feature "proc-macro" '

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
