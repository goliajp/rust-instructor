[package]
name = "instructors"
version = "1.5.1"
edition = "2024"
description = "Typed structured output from LLMs over the OpenAI, Anthropic and Gemini APIs, with validation, retry and streaming partial JSON"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/rust-instructor"
authors = ["GOLIA株式会社", "Li Hao <lihao@golia.jp>"]
documentation = "https://docs.rs/instructors"
keywords = ["llm", "structured-output", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous", "parser-implementations"]
readme = "README.md"

[workspace]
members = ["derive"]

[dependencies]
instructors-derive = { version = "=1.5.1", path = "derive", optional = true }
serde = { version = "1", features = ["derive"] }
# json facade backend until the in-house parser lands
serde_json = { version = "1", features = ["raw_value"] }
# the reqwest feature: rustls with the ring provider, no system TLS library
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", optional = true, features = ["time"] }
bytes = { version = "1", optional = true }
# only `tiktoken::pricing` is used; without default features no vocabulary
# data is linked
tiktoken = { version = "5.4", optional = true, default-features = false }
tracing = { version = "0.1", optional = true }
jsonrepair = "0.1"
schemars = { version = "1", optional = true }

[features]
default = ["derive", "reqwest", "cost-tracking"]
derive = ["dep:instructors-derive"]
reqwest = ["dep:reqwest", "dep:rustls", "dep:tokio", "dep:bytes"]
cost-tracking = ["dep:tiktoken"]
tracing = ["dep:tracing"]
serde_json = []
schemars = ["dep:schemars", "serde_json"]
# kept so 1.5 manifests still build; 2.0 always keeps declaration order
preserve-order = []

[dev-dependencies]
instructors-derive = { version = "=1.5.1", path = "derive" }
# the previous release, for request differential tests
instructors_1 = { package = "instructors", version = "=1.5.1" }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
criterion = "0.8"

[[bench]]
name = "schema"
harness = false

[profile.release]
lto = true
codegen-units = 1
