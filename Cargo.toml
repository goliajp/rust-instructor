[package]
name = "instructors"
version = "1.5.1"
edition = "2024"
description = "Typed structured output from LLMs over the OpenAI, Anthropic and Gemini APIs, with validation, retry and streaming partial JSON"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/rust-instructor"
authors = ["GOLIA株式会社", "Li Hao <lihao@golia.jp>"]
documentation = "https://docs.rs/instructors"
keywords = ["llm", "structured-output", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous", "parser-implementations"]
readme = "README.md"
exclude = ["fuzz"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
rand = "0.10"
# only `tiktoken::pricing` is used; without default features no vocabulary
# data is linked
tiktoken = { version = "5.4", optional = true, default-features = false }
tracing = { version = "0.1", optional = true }

[features]
default = ["cost-tracking"]
cost-tracking = ["tiktoken"]
tracing = ["dep:tracing"]
# schema properties in declaration order; turns on `serde_json/preserve_order`
# for every crate in the build
preserve-order = ["schemars/preserve_order"]
# internals for the fuzz targets and the json benchmark; not a public API
fuzzing = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
criterion = "0.8"
# compared against in the json benchmark only
jsonrepair = "0.1"

[[bench]]
name = "schema"
harness = false

[[bench]]
name = "json"
harness = false
required-features = ["fuzzing"]

[profile.release]
lto = true
codegen-units = 1
